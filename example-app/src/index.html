<!doctype html>
<html lang="en" dir="ltr" class="hydrated">
  <head>
    <meta charset="UTF-8" />
    <title>Example Capacitor App</title>
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
  </head>
  <body>
    <main>
      <p style="margin:0 0 16px"><a href="./player.html"
        style="display:block;padding:14px;background:#6d5efc;color:#fff;
               border-radius:8px;text-align:center;text-decoration:none;
               font:600 16px system-ui">Player composite proof &rarr;</a></p>
      <h1>NPE Capacitor Plugin - YouTube Stream Extractor</h1>
      <p>
        Test the NewPipeExtractor plugin to extract YouTube video streams and metadata.
      </p>
      
      <div style="margin: 20px 0;">
        <label for="videoUrlInput">YouTube Video URL:</label><br>
        <input 
          type="text" 
          id="videoUrlInput" 
          name="videoUrlInput" 
          value="https://www.youtube.com/watch?v=kJQP7kiw5Fk" 
          style="width: 400px; padding: 8px;"
        />
        <br><br>
        <button onclick="extractYouTubeStreams()" style="padding: 10px 20px;">Extract Stream Info</button>
      </div>

      <div id="result" style="margin: 20px 0; padding: 10px; border: 1px solid #ccc; min-height: 100px;">
        Click "Extract Stream Info" to see video streams and metadata
      </div>
    </main>

    <script src="./js/example.js" type="module"></script>
  </body>
</html>
